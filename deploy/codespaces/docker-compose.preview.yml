services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address :9001
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${GENITHM_PREVIEW_STORAGE_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${GENITHM_PREVIEW_STORAGE_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${GENITHM_PREVIEW_WEB_ORIGIN}
    ports:
      - "9000:9000"
    volumes:
      - genithm-preview-storage:/data

  minio-setup:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    environment:
      ACCESS_KEY: ${GENITHM_PREVIEW_STORAGE_ACCESS_KEY}
      SECRET_KEY: ${GENITHM_PREVIEW_STORAGE_SECRET_KEY}
      BUCKET: ${GENITHM_R2_SEQUENCE_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        until mc alias set preview http://minio:9000 "$$ACCESS_KEY" "$$SECRET_KEY"; do sleep 1; done
        mc mb --ignore-existing "preview/$$BUCKET"

  api:
    image: ${GENITHM_API_IMAGE:?GENITHM_API_IMAGE is required}
    restart: unless-stopped
    environment:
      GENITHM_ENV: development
      GENITHM_API_ALLOWED_ORIGINS: ${GENITHM_PREVIEW_WEB_ORIGIN}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      GENITHM_R2_ENDPOINT: http://minio:9000
      GENITHM_R2_ACCESS_KEY_ID: ${GENITHM_PREVIEW_STORAGE_ACCESS_KEY}
      GENITHM_R2_SECRET_ACCESS_KEY: ${GENITHM_PREVIEW_STORAGE_SECRET_KEY}
      GENITHM_R2_SEQUENCE_BUCKET: ${GENITHM_R2_SEQUENCE_BUCKET}
      GENITHM_STORAGE_SIGNED_URL_SECONDS: "900"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      minio-setup:
        condition: service_completed_successfully

  sequence-worker:
    image: ${GENITHM_SEQUENCE_WORKER_IMAGE:?GENITHM_SEQUENCE_WORKER_IMAGE is required}
    restart: unless-stopped
    environment: &common-worker-env
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY}
      GENITHM_R2_ENDPOINT: http://minio:9000
      GENITHM_R2_ACCESS_KEY_ID: ${GENITHM_PREVIEW_STORAGE_ACCESS_KEY}
      GENITHM_R2_SECRET_ACCESS_KEY: ${GENITHM_PREVIEW_STORAGE_SECRET_KEY}
      GENITHM_R2_SEQUENCE_BUCKET: ${GENITHM_R2_SEQUENCE_BUCKET}
      GENITHM_ALLOW_INSECURE_R2_ENDPOINT: "true"
      NCBI_EMAIL: ${NCBI_EMAIL}
      NCBI_API_KEY: ${NCBI_API_KEY:-}

  source-worker:
    image: ${GENITHM_SOURCE_WORKER_IMAGE:?GENITHM_SOURCE_WORKER_IMAGE is required}
    restart: unless-stopped
    environment: *common-worker-env

  blast-worker:
    image: ${GENITHM_BLAST_WORKER_IMAGE:?GENITHM_BLAST_WORKER_IMAGE is required}
    restart: unless-stopped
    environment: *common-worker-env

  scientific-worker:
    image: ${GENITHM_SCIENTIFIC_WORKER_IMAGE:?GENITHM_SCIENTIFIC_WORKER_IMAGE is required}
    restart: unless-stopped
    environment: *common-worker-env

  audit-worker:
    image: ${GENITHM_AUDIT_WORKER_IMAGE:?GENITHM_AUDIT_WORKER_IMAGE is required}
    restart: unless-stopped
    environment:
      <<: *common-worker-env
      GENITHM_AUDIT_SIGNING_KEY_ID: ${GENITHM_AUDIT_SIGNING_KEY_ID}
      GENITHM_AUDIT_SIGNING_PRIVATE_KEY_BASE64: ${GENITHM_AUDIT_SIGNING_PRIVATE_KEY_BASE64}

  ai-worker:
    image: ${GENITHM_AI_WORKER_IMAGE:?GENITHM_AI_WORKER_IMAGE is required}
    restart: unless-stopped
    environment:
      <<: *common-worker-env
      GENITHM_AI_PRIMARY_PROVIDER: deepseek
      GENITHM_AI_PRIMARY_API_KEY: ${DEEPSEEK_API_KEY}
      GENITHM_AI_PRIMARY_ENDPOINT: ${GENITHM_AI_PRIMARY_ENDPOINT}
      GENITHM_AI_PRIMARY_MODEL: ${GENITHM_AI_PRIMARY_MODEL}
      GENITHM_AI_PRIMARY_PROTOCOL: chat_completions
      GENITHM_AI_BACKUP_ENABLED: "false"

volumes:
  genithm-preview-storage:
