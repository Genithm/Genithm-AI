services:
  api:
    image: ${GENITHM_API_IMAGE:?GENITHM_API_IMAGE must be a digest-pinned image reference}
    container_name: genithm-api
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      GENITHM_ENV: production
      GENITHM_API_ALLOWED_ORIGINS: ${GENITHM_API_ALLOWED_ORIGINS:?GENITHM_API_ALLOWED_ORIGINS is required}
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?SUPABASE_SECRET_KEY is required}
      GENITHM_R2_ENDPOINT: ${GENITHM_R2_ENDPOINT:?GENITHM_R2_ENDPOINT is required}
      GENITHM_R2_ACCESS_KEY_ID: ${GENITHM_R2_ACCESS_KEY_ID:?GENITHM_R2_ACCESS_KEY_ID is required}
      GENITHM_R2_SECRET_ACCESS_KEY: ${GENITHM_R2_SECRET_ACCESS_KEY:?GENITHM_R2_SECRET_ACCESS_KEY is required}
      GENITHM_R2_SEQUENCE_BUCKET: ${GENITHM_R2_SEQUENCE_BUCKET:?GENITHM_R2_SEQUENCE_BUCKET is required}
      GENITHM_STORAGE_SIGNED_URL_SECONDS: ${GENITHM_STORAGE_SIGNED_URL_SECONDS:-300}
    ports:
      - "127.0.0.1:${GENITHM_API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: ${GENITHM_CLOUDFLARED_IMAGE:?GENITHM_CLOUDFLARED_IMAGE must be a digest-pinned Cloudflare image reference}
    container_name: genithm-cloudflared
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    environment:
      TUNNEL_TOKEN: ${GENITHM_CLOUDFLARE_TUNNEL_TOKEN:?GENITHM_CLOUDFLARE_TUNNEL_TOKEN is required}
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
    depends_on:
      api:
        condition: service_healthy
