services:
  sequence-worker:
    image: ${GENITHM_SEQUENCE_WORKER_IMAGE}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    env_file: .env.workers
    environment:
      NCBI_TOOL: genithm
      LOG_LEVEL: INFO
      GENITHM_SEQUENCE_VISIBILITY_SECONDS: "300"
      GENITHM_SEQUENCE_MAX_ATTEMPTS: "3"
      GENITHM_SEQUENCE_POLL_SECONDS: "2"

  source-worker:
    image: ${GENITHM_SOURCE_WORKER_IMAGE}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp:rw,noexec,nosuid,size=16m]
    env_file: .env.workers
