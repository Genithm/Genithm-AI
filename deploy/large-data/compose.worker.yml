# V68: opt-in private verifiers. This file provisions no S3, project quotas,
# web server, credentials, or externally reachable ports. Operator approval
# and an external private secrets file are required before any process starts.
name: genithm-private-file-workers

x-private-worker: &private-worker
  build:
    context: ../../apps/api
    dockerfile: Dockerfile
  image: genithm-private-file-worker:operator-local
  env_file:
    - "${GENITHM_LARGE_DATA_WORKER_ENV:?Set the absolute path to the private worker environment file}"
  init: true
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  mem_limit: 1g
  cpus: 2.0
  tmpfs:
    - /tmp:rw,nosuid,noexec,size=256m,mode=1777
  stop_grace_period: 90s

services:
  verifier:
    <<: *private-worker
    # API image's default ENTRYPOINT serves HTTP; override to run worker.
    entrypoint: ["python", "-m", "app.large_data.worker"]
    environment:
      GENITHM_LARGE_DATA_ENABLED: "true"

  pair-verifier:
    <<: *private-worker
    profiles:
      - paired
    entrypoint: ["python", "-m", "app.large_data.pair_worker"]
    environment:
      GENITHM_LARGE_DATA_ENABLED: "true"
      GENITHM_LARGE_DATA_PAIRING_ENABLED: "true"
