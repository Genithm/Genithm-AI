[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genithm-scientific-worker"
version = "0.4.0"
description = "Isolated deterministic scientific execution worker for Genithm"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
genithm-scientific-worker = "genithm_scientific_worker.entrypoint:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
