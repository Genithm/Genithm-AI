[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genithm-sequence-worker"
version = "0.1.0"
description = "Deterministic scientific validation core for Genithm sequence inputs"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
genithm-sequence-worker = "genithm_sequence_worker.runtime:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
