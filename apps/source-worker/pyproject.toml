[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genithm-source-worker"
version = "0.3.0"
description = "Controlled external scientific source adapters for Genithm"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
genithm-source-worker = "genithm_source_worker.runtime_v2:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
