[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genithm-blast-worker"
version = "0.1.0"
description = "Controlled asynchronous NCBI BLAST worker for Genithm"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
genithm-blast-worker = "genithm_blast_worker.entrypoint:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
