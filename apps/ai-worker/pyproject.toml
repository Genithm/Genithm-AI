[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genithm-ai-worker"
version = "0.1.0"
description = "Permission-controlled AI scientific planning worker for Genithm"
requires-python = ">=3.13,<3.14"
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
genithm-ai-worker = "genithm_ai_worker.runtime:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
