[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genithm-audit-worker"
version = "0.1.0"
description = "Isolated Ed25519 signer for Genithm audit checkpoints"
requires-python = ">=3.13,<3.14"
dependencies = ["cryptography==50.0.1"]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[project.scripts]
genithm-audit-worker = "genithm_audit_worker.entrypoint:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
