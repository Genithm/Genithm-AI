name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Enforce repository security policy
        run: python scripts/security_policy.py
      - name: Audit web production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Install pinned Python auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit API dependencies
        run: pip-audit --strict apps/api
      - name: Audit sequence worker dependencies
        run: pip-audit --strict apps/sequence-worker
      - name: Audit source worker dependencies
        run: pip-audit --strict apps/source-worker
      - name: Audit BLAST worker dependencies
        run: pip-audit --strict apps/blast-worker
      - name: Audit audit-signer worker dependencies
        run: pip-audit --strict apps/audit-worker
      - name: Audit scientific worker dependencies
        run: pip-audit --strict apps/scientific-worker
      - name: Audit AI worker dependencies
        run: pip-audit --strict apps/ai-worker

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13', cache: pip, cache-dependency-path: apps/api/pyproject.toml }
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  sequence-worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/sequence-worker } }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13', cache: pip, cache-dependency-path: apps/sequence-worker/pyproject.toml }
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  source-worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/source-worker } }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13', cache: pip, cache-dependency-path: apps/source-worker/pyproject.toml }
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  blast-worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/blast-worker } }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13', cache: pip, cache-dependency-path: apps/blast-worker/pyproject.toml }
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  audit-worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/audit-worker } }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13', cache: pip, cache-dependency-path: apps/audit-worker/pyproject.toml }
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  scientific-worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/scientific-worker } }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13', cache: pip, cache-dependency-path: apps/scientific-worker/pyproject.toml }
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  ai-worker:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/ai-worker } }
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: { python-version: '3.13', cache: pip, cache-dependency-path: apps/ai-worker/pyproject.toml }
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  sequence-worker-image:
    uses: ./.github/workflows/worker-image.yml
    with:
      context: apps/sequence-worker
      image_name: genithm-sequence-worker
      artifact_prefix: sequence-worker

  source-worker-image:
    uses: ./.github/workflows/worker-image.yml
    with:
      context: apps/source-worker
      image_name: genithm-source-worker
      artifact_prefix: source-worker

  blast-worker-image:
    uses: ./.github/workflows/worker-image.yml
    with:
      context: apps/blast-worker
      image_name: genithm-blast-worker
      artifact_prefix: blast-worker

  audit-worker-image:
    uses: ./.github/workflows/worker-image.yml
    with:
      context: apps/audit-worker
      image_name: genithm-audit-worker
      artifact_prefix: audit-worker

  scientific-worker-image:
    uses: ./.github/workflows/worker-image.yml
    with:
      context: apps/scientific-worker
      image_name: genithm-scientific-worker
      artifact_prefix: scientific-worker

  ai-worker-image:
    uses: ./.github/workflows/worker-image.yml
    with:
      context: apps/ai-worker
      image_name: genithm-ai-worker
      artifact_prefix: ai-worker
