name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Enforce repository security policy
        run: python scripts/security_policy.py
      - name: Audit web production dependencies
        working-directory: apps/web
        run: npm audit --omit=dev --audit-level=high
      - name: Install pinned Python auditor
        run: python -m pip install pip-audit==2.10.1
      - name: Audit API dependencies
        run: pip-audit --strict apps/api
      - name: Audit sequence worker dependencies
        run: pip-audit --strict apps/sequence-worker
      - name: Audit source worker dependencies
        run: pip-audit --strict apps/source-worker
      - name: Audit BLAST worker dependencies
        run: pip-audit --strict apps/blast-worker

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  sequence-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/sequence-worker
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/sequence-worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  sequence-worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Build worker image
        run: docker build --pull -t genithm-sequence-worker:ci apps/sequence-worker
      - name: Verify image declares non-root user
        run: test "$(docker image inspect --format '{{.Config.User}}' genithm-sequence-worker:ci)" != "" && test "$(docker image inspect --format '{{.Config.User}}' genithm-sequence-worker:ci)" != "root" && test "$(docker image inspect --format '{{.Config.User}}' genithm-sequence-worker:ci)" != "0"
      - name: Verify hardened runtime
        run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=1 --network=none --tmpfs /tmp:rw,noexec,nosuid,size=16m genithm-sequence-worker:ci --help

  source-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/source-worker
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/source-worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  source-worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Build source worker image
        run: docker build --pull -t genithm-source-worker:ci apps/source-worker
      - name: Verify image declares non-root user
        run: test "$(docker image inspect --format '{{.Config.User}}' genithm-source-worker:ci)" != "" && test "$(docker image inspect --format '{{.Config.User}}' genithm-source-worker:ci)" != "root" && test "$(docker image inspect --format '{{.Config.User}}' genithm-source-worker:ci)" != "0"
      - name: Verify hardened runtime
        run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=1 --network=none --tmpfs /tmp:rw,noexec,nosuid,size=16m genithm-source-worker:ci --help

  blast-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/blast-worker
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/blast-worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest

  blast-worker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Build BLAST worker image
        run: docker build --pull -t genithm-blast-worker:ci apps/blast-worker
      - name: Verify image declares non-root user
        run: test "$(docker image inspect --format '{{.Config.User}}' genithm-blast-worker:ci)" != "" && test "$(docker image inspect --format '{{.Config.User}}' genithm-blast-worker:ci)" != "root" && test "$(docker image inspect --format '{{.Config.User}}' genithm-blast-worker:ci)" != "0"
      - name: Verify hardened runtime
        run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=1 --network=none --tmpfs /tmp:rw,noexec,nosuid,size=16m genithm-blast-worker:ci --help
