name: Worker production preflight

on:
  workflow_dispatch:
    inputs:
      source_revision:
        description: Full tested commit SHA from a successful Worker release
        required: true
        type: string
      release_run_id:
        description: Successful Worker release workflow run ID containing the release artifact
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: genithm-worker-production-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Validate dispatch inputs
        shell: bash
        env:
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'source_revision must be a full lowercase Git SHA' >&2; exit 2; }
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'release_run_id must be numeric' >&2; exit 2; }

      - name: Verify release workflow provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REVISION: ${{ inputs.source_revision }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}" > "$RUNNER_TEMP/release-run.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          run = json.loads(Path(os.environ['RUNNER_TEMP'], 'release-run.json').read_text())
          expected_revision = os.environ['SOURCE_REVISION']
          checks = {
              'name': run.get('name') == 'Worker release',
              'conclusion': run.get('conclusion') == 'success',
              'head_sha': run.get('head_sha') == expected_revision,
              'head_branch': run.get('head_branch') == 'main',
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('release workflow provenance check failed: ' + ', '.join(failed))
          print('release workflow provenance verified')
          PY
          rm -f "$RUNNER_TEMP/release-run.json"

      - name: Download exact release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: genithm-worker-release-${{ inputs.source_revision }}
          path: release
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}

      - name: Validate immutable release artifact
        run: |
          python scripts/validate_worker_release.py \
            --release-manifest release/worker-release.json \
            --deployment-manifest release/genithm-workers.yaml \
            --expected-revision '${{ inputs.source_revision }}'

      - name: Print deployment boundary
        run: |
          echo 'Production worker release preflight passed.'
          echo 'No cluster credentials or GitHub secrets are consumed by repository workflows.'
          echo 'Apply release/genithm-workers.yaml only from an authorized external deployment environment, then verify all six heartbeats through Genithm readiness.'
