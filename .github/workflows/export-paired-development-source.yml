name: Export paired development source
on:
  push:
    branches: [feat/paired-large-data-v45]
    paths: [.github/workflows/export-paired-development-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          ref: aa08584b669abea741888ff775600c215aee8323
      - name: Archive tracked baseline only
        run: |
          mkdir /tmp/genithm-source
          git archive --format=zip HEAD > /tmp/genithm-source/source.zip
          git rev-parse HEAD > /tmp/genithm-source/revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genithm-v45-source-baseline
          path: /tmp/genithm-source
          retention-days: 2
