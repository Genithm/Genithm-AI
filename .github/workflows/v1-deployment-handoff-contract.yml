name: V1 deployment handoff contract

on:
  pull_request:
    paths:
      - scripts/render_v1_deployment_env.py
      - scripts/test_render_v1_deployment_env.py
      - .github/workflows/v1-deployment-handoff-contract.yml
  push:
    branches: [main]
    paths:
      - scripts/render_v1_deployment_env.py
      - scripts/test_render_v1_deployment_env.py
      - .github/workflows/v1-deployment-handoff-contract.yml

permissions:
  contents: read

jobs:
  handoff-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test deployment handoff renderer
        run: python scripts/test_render_v1_deployment_env.py
