name: V51 reviewed patch preparation
on:
  push:
    branches: [fix/v51-runtime-startup]
    paths: [.github/v51-runtime.patch.b64]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Validate and apply exact reviewed source patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, subprocess, zlib
          from pathlib import Path
          raw=zlib.decompress(base64.b64decode(Path('.github/v51-runtime.patch.b64').read_text().strip(),validate=True))
          if hashlib.sha256(raw).hexdigest() != '6ab7a6785551d99afb1e68f77e3ddc1e310e17d1efdbe83b3b36dddb2160edd3':
              raise SystemExit('Patch digest mismatch; no changes applied')
          patch=Path('/tmp/v51-reviewed.patch'); patch.write_bytes(raw)
          names={line.split('\t',2)[2] for line in subprocess.check_output(['git','apply','--numstat',str(patch)],text=True).splitlines()}
          allowed={'.devcontainer/devcontainer.json','.devcontainer/start.sh','apps/web/lib/ai-provider-gateway.ts','apps/web/package.json','apps/web/tests/codespaces-full-preview-v31.test.mjs','apps/web/tests/runtime-version-v51.test.mjs','docs/runtime-startup-v51.md','scripts/check_web_runtime.mjs','scripts/codespaces_bioai.sh','scripts/codespaces_preview.sh','scripts/stop_codespaces_web.py','scripts/tests/test_development_readiness_v50.py','scripts/tests/test_runtime_startup_v51.py'}
          if names != allowed: raise SystemExit('Unexpected patch paths')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          subprocess.run(['git','add','--',*sorted(names)],check=True)
          PY
          git diff --cached --check
          python3 scripts/security_policy.py
          python3 -m unittest discover -s scripts/tests -p test_runtime_startup_v51.py
          python3 -m unittest discover -s scripts/tests -p test_development_readiness_v50.py
          python3 scripts/test_codespaces_preview.py
          node --experimental-strip-types --test apps/web/tests/*.test.mjs
          bash -n .devcontainer/start.sh scripts/codespaces_bioai.sh scripts/codespaces_preview.sh
      - name: Commit tested source to work branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'V51: refuse stale Next.js runtime and load Codespaces AI configuration on startup'
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w 0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/fix/v51-runtime-startup
          git rev-parse HEAD
