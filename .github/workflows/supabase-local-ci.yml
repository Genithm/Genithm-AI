name: Supabase Local CI

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local-ci.yml"
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-local-ci.yml"

permissions:
  contents: read

concurrency:
  group: supabase-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.117.0
      - name: Verify Supabase CLI version
        run: supabase --version
      - name: Start local Supabase database
        run: supabase db start
      - name: Replay all migrations from scratch
        run: supabase db reset --local
      - name: Verify V14 autonomous pipeline RLS, dispatch permissions, and event triggers
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/v14_research_pipeline_contract.sql
      - name: Verify V16 nucleotide ORF template, grants, and event-driven pipeline transitions
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/v16_nucleotide_pipeline_contract.sql
      - name: Verify V22 chat-to-pipeline lineage, RLS and authorized parser behavior
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/v22_chat_pipeline_lineage_contract.sql
      - name: Verify V22 PostgreSQL research intent parity with the shared chat corpus
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/v22_chat_intent_parity.sql
      - name: Exercise V22 two-user approval, replay, RLS and media attestation against local PostgreSQL
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/v22_chat_pipeline_integration.sql
      - name: Verify V2 sequence intelligence database boundaries
        shell: bash
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 <<'SQL'
          do $sequence_insights$
          declare
            kinds text;
          begin
            if to_regprocedure('public.request_sequence_insights(uuid,uuid,text,text,integer)') is null
               or to_regprocedure('public.finish_sequence_insights_job_success(bigint,uuid,text,text,text,bigint,jsonb,jsonb)') is null then
              raise exception 'V2 sequence intelligence RPCs are missing';
            end if;
            if not has_function_privilege('authenticated',
                 'public.request_sequence_insights(uuid,uuid,text,text,integer)','EXECUTE')
               or has_function_privilege('anon',
                 'public.request_sequence_insights(uuid,uuid,text,text,integer)','EXECUTE') then
              raise exception 'V2 sequence request grants are incorrect';
            end if;
            if not has_function_privilege('service_role',
                 'public.finish_sequence_insights_job_success(bigint,uuid,text,text,text,bigint,jsonb,jsonb)','EXECUTE')
               or has_function_privilege('authenticated',
                 'public.finish_sequence_insights_job_success(bigint,uuid,text,text,text,bigint,jsonb,jsonb)','EXECUTE')
               or has_function_privilege('anon',
                 'public.finish_sequence_insights_job_success(bigint,uuid,text,text,text,bigint,jsonb,jsonb)','EXECUTE') then
              raise exception 'V2 result completion is not service-only';
            end if;
            select pg_get_constraintdef(oid) into kinds
              from pg_constraint
             where conrelid='public.scientific_jobs'::regclass and conname='scientific_jobs_type';
            if kinds is null or position('sequence_insights' in kinds)=0 then
              raise exception 'V2 scientific job type constraint is missing';
            end if;
            if not exists(
              select 1 from app_private.scientific_tools
              where tool_id='genithm-sequence-insights' and tool_version='0.1.0'
                and status='approved' and network_required=false
            ) then
              raise exception 'V2 approved scientific tool was not registered';
            end if;
          end
          $sequence_insights$;
          SQL
      - name: Verify AI sequence dispatch and invalid-plan boundaries
        shell: bash
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 <<'SQL'
          do $ai_seq$
          declare
            req public.ai_plan_requests%rowtype;
            plan jsonb;
            result text;
            dispatcher text;
          begin
            if to_regprocedure('app_private.validate_ai_plan_for_request_v2(public.ai_plan_requests,jsonb)') is null then
              raise exception 'AI sequence validation RPC missing';
            end if;
            dispatcher := pg_get_functiondef('app_private.dispatch_ai_plan_service(uuid,uuid)'::regprocedure);
            if position('request_sequence_insights' in dispatcher)=0
               or position('request.jwt.claim.sub' in dispatcher)=0 then
              raise exception 'AI sequence dispatch lost tool routing or actor binding';
            end if;
            if has_function_privilege('authenticated','app_private.dispatch_ai_plan_service(uuid,uuid)','EXECUTE')
               or has_function_privilege('anon','app_private.dispatch_ai_plan_service(uuid,uuid)','EXECUTE')
               or not has_function_privilege('service_role','app_private.dispatch_ai_plan_service(uuid,uuid)','EXECUTE') then
              raise exception 'AI sequence service dispatch permissions are unsafe';
            end if;
            plan := jsonb_build_object(
              'schema_version','ai-plan-v1',
              'intent','scientific_action',
              'summary','Scan approved sequence.',
              'limitations',jsonb_build_array(),
              'action',jsonb_build_object(
                'type','sequence_insights',
                'parameters',jsonb_build_object(
                  'sequence_upload_id','00000000-0000-0000-0000-000000000001',
                  'operation','motif_scan','motif','AT*','min_aa',30
                )
              )
            );
            begin
              perform app_private.validate_ai_plan_for_request_v2(req,plan);
              raise exception 'invalid motif unexpectedly accepted';
            exception when others then
              if sqlerrm not like 'AI motif scan parameters are invalid' then raise; end if;
            end;
            plan := jsonb_set(plan,'{action,parameters,motif}','"ATG"'::jsonb);
            begin
              perform app_private.validate_ai_plan_for_request_v2(req,plan);
              raise exception 'nonexistent input unexpectedly accepted';
            exception when others then
              if sqlerrm not like 'AI sequence intelligence input is not authorized or executable' then raise; end if;
            end;
          end
          $ai_seq$;
          SQL
      - name: Verify V1 scientific runtime security contract
        shell: bash
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          declare
            proc text;
          begin
            if to_regclass('public.analysis_jobs') is null
              or to_regclass('public.analysis_results') is null
              or to_regclass('public.evidence_snapshots') is null then
              raise exception 'V1 scientific runtime tables are missing';
            end if;

            if exists (
              select 1
              from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public'
                and c.relname in ('analysis_jobs', 'analysis_results', 'evidence_snapshots')
                and (not c.relrowsecurity or not c.relforcerowsecurity)
            ) then
              raise exception 'V1 scientific runtime tables must have RLS enabled and forced';
            end if;

            foreach proc in array array[
              'public.claim_analysis_job(text,integer)',
              'public.renew_analysis_job_lease(uuid,text,integer)',
              'public.finish_analysis_job_success(uuid,text,jsonb,text,text,jsonb,text,timestamptz,jsonb)',
              'public.finish_analysis_job_error(uuid,text,text,boolean)'
            ] loop
              if to_regprocedure(proc) is null then
                raise exception 'required worker RPC is missing: %', proc;
              end if;
              if not has_function_privilege('service_role', proc, 'EXECUTE') then
                raise exception 'service_role lacks EXECUTE on %', proc;
              end if;
              if has_function_privilege('anon', proc, 'EXECUTE')
                or has_function_privilege('authenticated', proc, 'EXECUTE')
                or has_function_privilege('public', proc, 'EXECUTE') then
                raise exception 'client/public role can execute privileged worker RPC: %', proc;
              end if;
            end loop;
          end
          $$;
          SQL
      - name: Verify instant AI chat security contract
        shell: bash
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 <<'SQL'
          do $instant_chat$
          declare
            status_constraint text;
          begin
            if not exists (
              select 1
              from information_schema.columns
              where table_schema='public'
                and table_name='ai_plan_requests'
                and column_name='attachment_upload_ids'
                and udt_name='_uuid'
            ) then
              raise exception 'instant AI attachment column is missing';
            end if;

            if not has_function_privilege('authenticated', 'public.request_ai_plan_inline(uuid,uuid,text,uuid[])', 'EXECUTE') then
              raise exception 'authenticated users cannot start instant AI chat';
            end if;

            if has_function_privilege('anon', 'public.request_ai_plan_inline(uuid,uuid,text,uuid[])', 'EXECUTE') then
              raise exception 'anon can start instant AI chat';
            end if;

            if not has_function_privilege('service_role', 'public.finish_ai_plan_inline(uuid,uuid,text,text,text,text,jsonb)', 'EXECUTE')
              or not has_function_privilege('service_role', 'public.finish_ai_plan_inline_error(uuid,uuid,text)', 'EXECUTE') then
              raise exception 'service role cannot finish instant AI chat';
            end if;

            if has_function_privilege('authenticated', 'public.finish_ai_plan_inline(uuid,uuid,text,text,text,text,jsonb)', 'EXECUTE')
              or has_function_privilege('authenticated', 'public.finish_ai_plan_inline_error(uuid,uuid,text)', 'EXECUTE')
              or has_function_privilege('anon', 'public.finish_ai_plan_inline(uuid,uuid,text,text,text,text,jsonb)', 'EXECUTE')
              or has_function_privilege('anon', 'public.finish_ai_plan_inline_error(uuid,uuid,text)', 'EXECUTE') then
              raise exception 'client role can forge instant AI completion';
            end if;

            if (
              select count(*)
              from pg_constraint
              where conrelid='public.ai_plan_requests'::regclass
                and contype='c'
                and conname in ('ai_plan_requests_status','ai_plan_requests_status_check')
            ) <> 1 then
              raise exception 'AI plan requests must have exactly one canonical status constraint';
            end if;

            select pg_get_constraintdef(oid)
              into status_constraint
              from pg_constraint
             where conrelid='public.ai_plan_requests'::regclass
               and conname='ai_plan_requests_status';

            if status_constraint is null
              or position('conversation' in status_constraint)=0
              or position('clarification_required' in status_constraint)=0 then
              raise exception 'AI plan status constraint does not include current chat states';
            end if;

            if not exists (
              select 1
              from app_private.scientific_rate_limit_policies
              where action='ai_chat'
                and window_seconds=60
                and user_limit=60
                and organization_limit=600
            ) then
              raise exception 'instant AI chat rate-limit policy is missing or incorrect';
            end if;

            if not exists (
              select 1
              from information_schema.columns
              where table_schema='public'
                and table_name='ai_messages'
                and column_name='attachment_upload_ids'
                and udt_name='_uuid'
            ) then
              raise exception 'direct AI chat message attachment column is missing';
            end if;

            if not has_function_privilege('authenticated', 'public.request_ai_chat_turn(uuid,uuid,text,uuid[])', 'EXECUTE') then
              raise exception 'authenticated users cannot start direct AI chat';
            end if;

            if has_function_privilege('anon', 'public.request_ai_chat_turn(uuid,uuid,text,uuid[])', 'EXECUTE') then
              raise exception 'anon can start direct AI chat';
            end if;

            if has_function_privilege('authenticated', 'public.finish_ai_chat_turn(uuid,uuid,text)', 'EXECUTE')
              or has_function_privilege('authenticated', 'public.create_ai_plan_from_chat(uuid,uuid,text,text,text,text,jsonb)', 'EXECUTE') then
              raise exception 'authenticated users can forge direct chat completion or scientific plans';
            end if;

            if not has_function_privilege('service_role', 'public.finish_ai_chat_turn(uuid,uuid,text)', 'EXECUTE')
              or not has_function_privilege('service_role', 'public.create_ai_plan_from_chat(uuid,uuid,text,text,text,text,jsonb)', 'EXECUTE')
              or not has_function_privilege('service_role', 'public.dispatch_ai_plan_service(uuid,uuid)', 'EXECUTE') then
              raise exception 'service role cannot finish direct chat, create plans, or dispatch scientific tasks';
            end if;

            if has_function_privilege('authenticated', 'public.dispatch_ai_plan_service(uuid,uuid)', 'EXECUTE')
              or has_function_privilege('anon', 'public.dispatch_ai_plan_service(uuid,uuid)', 'EXECUTE') then
              raise exception 'client role can auto-dispatch scientific tasks';
            end if;

            if to_regprocedure('app_private.ai_capability_preflight(uuid,uuid)') is null
              or to_regprocedure('app_private.validate_ai_plan_for_request_v3(public.ai_plan_requests,jsonb)') is null then
              raise exception 'capability-aware AI preflight functions are missing';
            end if;

            if has_function_privilege('authenticated', 'app_private.ai_capability_preflight(uuid,uuid)', 'EXECUTE')
              or has_function_privilege('anon', 'app_private.ai_capability_preflight(uuid,uuid)', 'EXECUTE')
              or has_function_privilege('service_role', 'app_private.ai_capability_preflight(uuid,uuid)', 'EXECUTE')
              or has_function_privilege('authenticated', 'app_private.validate_ai_plan_for_request_v3(public.ai_plan_requests,jsonb)', 'EXECUTE')
              or has_function_privilege('anon', 'app_private.validate_ai_plan_for_request_v3(public.ai_plan_requests,jsonb)', 'EXECUTE')
              or has_function_privilege('service_role', 'app_private.validate_ai_plan_for_request_v3(public.ai_plan_requests,jsonb)', 'EXECUTE') then
              raise exception 'private capability preflight functions are directly executable by application roles';
            end if;

            if position(
              'validate_ai_plan_for_request_v3'
              in pg_get_functiondef('app_private.create_ai_plan_from_chat(uuid,uuid,text,text,text,text,jsonb)'::regprocedure)
            )=0
              or position(
                'validate_ai_plan_for_request_v3'
                in pg_get_functiondef('app_private.dispatch_ai_plan_service(uuid,uuid)'::regprocedure)
              )=0 then
              raise exception 'scientific plan creation/dispatch does not use the strict capability validator';
            end if;

            if position(
              'capability_preflight'
              in pg_get_functiondef('app_private.request_ai_chat_turn(uuid,uuid,text,uuid[])'::regprocedure)
            )=0 then
              raise exception 'AI chat context does not include capability preflight';
            end if;

            if position(
              'set_config(''request.jwt.claim.sub'',p_expected_user_id::text,true)'
              in pg_get_functiondef('app_private.dispatch_ai_plan_service(uuid,uuid)'::regprocedure)
            )=0 then
              raise exception 'service-side AI dispatch does not restore the verified requester identity';
            end if;
          end
          $instant_chat$;
          SQL
      - name: Verify worker heartbeat RPC
        shell: bash
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 <<'SQL'
          begin;
          set local role service_role;
          select public.record_worker_heartbeat('sequence_worker', 'ci-heartbeat/1.0');
          select public.record_worker_heartbeat('sequence_worker', 'ci-heartbeat/1.1');
          reset role;

          do $heartbeat$
          declare
            heartbeat_count_value bigint;
            readiness jsonb;
          begin
            select heartbeat_count
              into heartbeat_count_value
              from app_private.worker_runtime_heartbeats
             where worker_kind = 'sequence_worker';

            if heartbeat_count_value <> 2 then
              raise exception 'heartbeat RPC did not upsert correctly: count=%', heartbeat_count_value;
            end if;

            if not has_function_privilege('service_role', 'public.record_worker_heartbeat(text,text)', 'EXECUTE') then
              raise exception 'service_role lacks heartbeat RPC execute';
            end if;

            if has_function_privilege('anon', 'public.record_worker_heartbeat(text,text)', 'EXECUTE')
              or has_function_privilege('authenticated', 'public.record_worker_heartbeat(text,text)', 'EXECUTE')
              or has_function_privilege('public', 'public.record_worker_heartbeat(text,text)', 'EXECUTE') then
              raise exception 'client/public role can execute heartbeat RPC';
            end if;

            readiness := public.get_release_readiness();
            if readiness->'missing_workers' is null then
              raise exception 'release readiness worker fields are missing';
            end if;
          end
          $heartbeat$;
          rollback;
          SQL
      - name: Verify V24 research archive keyset paging, deep history and cross-tenant isolation
        run: psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -v ON_ERROR_STOP=1 -f supabase/tests/v24_research_archive_pagination.sql
      - name: Exercise V22 concurrent approvals and rolled-back request recovery
        run: bash supabase/tests/v22_chat_pipeline_concurrency.sh
      - name: V25 read-only provenance audit must flag unexecuted local science as incomplete
        shell: bash
        run: |
          set -euo pipefail
          db='postgresql://postgres:postgres@127.0.0.1:54322/postgres'
          message_id='b5000000-0000-4000-8000-000000000001'
          run_id=$(psql "$db" -X -qAt -v ON_ERROR_STOP=1 -c "select research_pipeline_run_id from public.ai_messages where id='$message_id';")
          if [[ -z "$run_id" ]]; then echo 'V25 audit fixture lacks an approved run' >&2; exit 1; fi
          output=$(psql "$db" -X -v ON_ERROR_STOP=1 -v message_id="$message_id" -v run_id="$run_id" -f supabase/tests/v25_staging_evidence_readonly.sql)
          echo "$output"
          if ! grep -q 'REVIEW: recorded lineage incomplete' <<< "$output"; then
            echo 'V25 incomplete local run was incorrectly claimed to have verified evidence' >&2
            exit 1
          fi
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
