name: Prepare universal file migration
on:
  push:
    branches: [feat/universal-file-intake-v47]
    paths: [.github/workflows/prepare-universal-file-migration.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0
      - name: Generate migration without connecting to any database
        run: |
          supabase --version
          supabase migration --help
          supabase migration new --help
          supabase migration new universal_file_intake_v47
          mkdir -p /tmp/genithm-v47
          find supabase/migrations -name '*universal_file_intake_v47.sql' -exec cp {} /tmp/genithm-v47/ \;
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genithm-v47-migration-template
          path: /tmp/genithm-v47
          retention-days: 2
