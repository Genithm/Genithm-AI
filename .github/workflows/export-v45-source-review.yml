name: Export V45 source for local review
on:
  push:
    branches: ['feat/managed-paired-fastq-v45']
    paths: ['.github/workflows/export-v45-source-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: aa08584b669abea741888ff775600c215aee8323
          persist-credentials: false
      - run: |
          mkdir snapshot
          git archive --format=zip HEAD > snapshot/source.zip
          sha256sum snapshot/source.zip > snapshot/source.sha256
          git rev-parse HEAD > snapshot/revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genithm-v45-source-review
          path: snapshot
          retention-days: 3
