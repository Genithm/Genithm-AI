name: Codespaces Preview Contract

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'apps/web/app/preview/**'
      - 'apps/web/app/layout.tsx'
      - 'apps/web/app/page.tsx'
      - 'apps/web/proxy.ts'
      - 'scripts/codespaces-science-smoke.py'
      - 'scripts/codespaces-live-science.py'
      - 'scripts/codespaces-live-science-server.py'
      - 'scripts/test_codespaces_live_lab.py'
      - 'scripts/test_codespaces_genomics_qc.py'
      - 'scripts/test_codespaces_comparative.py'
      - 'scripts/test_codespaces_msa_v5.py'
      - 'apps/scientific-worker/genithm_scientific_worker/codespaces_msa.py'
      - 'apps/scientific-worker/genithm_scientific_worker/sequence_comparison.py'
      - 'apps/scientific-worker/genithm_scientific_worker/pairwise.py'
      - 'apps/scientific-worker/genithm_scientific_worker/sequence_composition.py'
      - 'apps/web/app/api/dev-science/**'
      - 'scripts/test_codespaces_preview.py'
      - 'scripts/codespaces_preview.sh'
      - 'deploy/codespaces/**'
      - '.github/workflows/codespaces-preview-contract.yml'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'apps/web/app/preview/**'
      - 'apps/web/app/layout.tsx'
      - 'apps/web/app/page.tsx'
      - 'apps/web/proxy.ts'
      - 'scripts/codespaces-science-smoke.py'
      - 'scripts/codespaces-live-science.py'
      - 'scripts/codespaces-live-science-server.py'
      - 'scripts/test_codespaces_live_lab.py'
      - 'scripts/test_codespaces_genomics_qc.py'
      - 'scripts/test_codespaces_comparative.py'
      - 'scripts/test_codespaces_msa_v5.py'
      - 'apps/scientific-worker/genithm_scientific_worker/codespaces_msa.py'
      - 'apps/scientific-worker/genithm_scientific_worker/sequence_comparison.py'
      - 'apps/scientific-worker/genithm_scientific_worker/pairwise.py'
      - 'apps/scientific-worker/genithm_scientific_worker/sequence_composition.py'
      - 'apps/web/app/api/dev-science/**'
      - 'scripts/test_codespaces_preview.py'
      - 'scripts/codespaces_preview.sh'
      - 'deploy/codespaces/**'
      - '.github/workflows/codespaces-preview-contract.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GENITHM_CODESPACES_PREVIEW: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Install MAFFT and FastTree for real integration tests
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends mafft fasttree
      - name: Verify MSA conservation, tree integrity and input bounds
        run: python scripts/test_codespaces_msa_v5.py
      - name: Run real scientific-worker methods offline
        run: python scripts/codespaces-science-smoke.py
      - name: Test live scientific workbench algorithms
        run: python scripts/test_codespaces_live_lab.py
      - name: Test compositional genomics and edge cases
        run: python scripts/test_codespaces_genomics_qc.py
      - name: Test comparative alignment and identity-matrix algorithms
        run: python scripts/test_codespaces_comparative.py
      - name: Verify Codespaces security and auth boundaries
        run: python scripts/test_codespaces_preview.py
      - name: Smoke test preview object storage image and bucket initialization
        shell: bash
        run: |
          set -euo pipefail
          env_file="$(mktemp)"
          compose_file="deploy/codespaces/docker-compose.preview.yml"
          project="genithm-s3-preview-ci"
          cleanup() {
            docker compose -p "$project" --env-file "$env_file" -f "$compose_file" down --volumes --remove-orphans >/dev/null 2>&1 || true
            rm -f "$env_file"
          }
          trap cleanup EXIT
          printf '%s\n' \
            'GENITHM_PREVIEW_STORAGE_IMAGE=docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46' \
            'GENITHM_PREVIEW_STORAGE_ACCESS_KEY=test-genithm' \
            'GENITHM_PREVIEW_STORAGE_SECRET_KEY=temporary-ci-only-password-0123456789' \
            'GENITHM_R2_SEQUENCE_BUCKET=genithm-ci-test-sequences' \
            'GENITHM_PREVIEW_WEB_ORIGIN=https://example.invalid' \
            'GENITHM_PREVIEW_STORAGE_PUBLIC_ENDPOINT=https://example.invalid' \
            'SUPABASE_URL=https://example.invalid' \
            'SUPABASE_PUBLISHABLE_KEY=ci-placeholder' \
            'SUPABASE_SECRET_KEY=ci-placeholder' \
            'NCBI_EMAIL=test@example.invalid' \
            'GENITHM_API_IMAGE=alpine:3.20' \
            'GENITHM_SEQUENCE_WORKER_IMAGE=alpine:3.20' \
            'GENITHM_SOURCE_WORKER_IMAGE=alpine:3.20' \
            'GENITHM_BLAST_WORKER_IMAGE=alpine:3.20' \
            'GENITHM_SCIENTIFIC_WORKER_IMAGE=alpine:3.20' \
            'GENITHM_AUDIT_WORKER_IMAGE=alpine:3.20' \
            'GENITHM_AI_WORKER_IMAGE=alpine:3.20' \
            'GENITHM_AUDIT_SIGNING_KEY_ID=ci-placeholder' \
            'GENITHM_AUDIT_SIGNING_PRIVATE_KEY_BASE64=ci-placeholder' \
            'GEMINI_API_KEY=synthetic-gemini-ci-key' \
            'GROQ_API_KEY=synthetic-groq-ci-key' \
            'GENITHM_GEMINI_MODEL=gemini-3.8-flash' \
            'GENITHM_GROQ_MODEL=llama-3.3-70b-versatile' \
            > "$env_file"
          docker compose -p "$project" --env-file "$env_file" -f "$compose_file" config --quiet
          docker compose -p "$project" --env-file "$env_file" -f "$compose_file" up \
            --abort-on-container-exit --exit-code-from minio-setup minio-setup

      - name: Install pinned frontend dependencies
        run: npm --prefix apps/web ci --no-fund
      - name: Check TypeScript
        working-directory: apps/web
        run: npm run typecheck
      - name: Verify public preview and protected workspace
        shell: bash
        run: |
          set -euo pipefail
          nohup python scripts/codespaces-live-science-server.py > "$RUNNER_TEMP/science.log" 2>&1 < /dev/null &
          for attempt in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:8769/health > /dev/null; then
              break
            fi
            sleep 1
          done
          (
            cd apps/web
            nohup npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/preview.log" 2>&1 < /dev/null &
          )
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 10 http://127.0.0.1:3000/preview -o "$RUNNER_TEMP/preview.html"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            tail -n 100 "$RUNNER_TEMP/preview.log" || true
            exit 1
          fi
          grep -q "SAMPLE-ONLY DEVELOPMENT WORKBENCH" "$RUNNER_TEMP/preview.html"
          grep -q "FIXTURE: ATGAAATAA" "$RUNNER_TEMP/preview.html"
          grep -q "Discover conservation and evolutionary patterns" "$RUNNER_TEMP/preview.html"
          grep -q "OFFLINE DEMO" "$RUNNER_TEMP/preview.html"
          curl -fsS --max-time 10 http://127.0.0.1:3000/ -o "$RUNNER_TEMP/home.html"
          grep -q "Sign In to Genithm" "$RUNNER_TEMP/home.html"
          curl -fsS --max-time 10 http://127.0.0.1:3000/login -o "$RUNNER_TEMP/login.html"
          grep -q "Full Genithm sign-in is not running yet" "$RUNNER_TEMP/login.html"
          curl -fsS --max-time 10 http://127.0.0.1:3000/signup -o "$RUNNER_TEMP/signup.html"
          grep -q "Full Genithm sign-in is not running yet" "$RUNNER_TEMP/signup.html"
          status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/ai)"
          test "$status" = "307"
          curl -sSI --max-time 10 http://127.0.0.1:3000/dashboard/ai > "$RUNNER_TEMP/auth-redirect.txt"
          grep -q '/login?setup=1' "$RUNNER_TEMP/auth-redirect.txt"
          cat > "$RUNNER_TEMP/analysis.json" <<'JSON'
          {"sequence":"ATGAAATAA","sequence_type":"dna","operation":"orf_scan","motif":null,"min_aa":2}
          JSON
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' \
            --data-binary @"$RUNNER_TEMP/analysis.json" http://127.0.0.1:3000/api/dev-science \
            -o "$RUNNER_TEMP/result.json"
          python -c "import json,sys; x=json.load(open(sys.argv[1])); assert x['result']['orfs'][0]['protein']=='MK'; assert x['summary']['orf_count']==1; assert x['mode']=='local-development-only'" "$RUNNER_TEMP/result.json"
          bad_status="$(curl -sS --max-time 15 -o "$RUNNER_TEMP/bad.json" -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' \
            --data '{"sequence":"ATG!","sequence_type":"dna","operation":"orf_scan","motif":null,"min_aa":2}' \
            http://127.0.0.1:3000/api/dev-science)"
          test "$bad_status" = "422"
          cross_status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Origin: https://malicious.example' \
            --data-binary @"$RUNNER_TEMP/analysis.json" http://127.0.0.1:3000/api/dev-science)"
          test "$cross_status" = "403"
          redirect_status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/ai)"
          test "$redirect_status" = "307"
          cat > "$RUNNER_TEMP/qc.json" <<'JSON'
          {"sequence":"ACGCGTT","sequence_type":"dna","operation":"composition_profile","motif":null,"min_aa":30}
          JSON
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' \
            --data-binary @"$RUNNER_TEMP/qc.json" http://127.0.0.1:3000/api/dev-science \
            -o "$RUNNER_TEMP/qc-result.json"
          python -c "import json,sys; o=json.load(open(sys.argv[1])); assert o['summary']['gc_percent']==57.14; assert o['summary']['cpg_count']==2; assert o['summary']['cpg_observed_expected']==3.5; assert o['tool']['id']=='genithm-local-composition'" "$RUNNER_TEMP/qc-result.json"

          grep -q "Compare DNA and RNA sequences" "$RUNNER_TEMP/preview.html"
          cat > "$RUNNER_TEMP/pairwise.json" <<'JSON'
          {"sequence":">ref\nACGTTGCA\n>query\nACGTCGCA","sequence_type":"dna","operation":"pairwise_global","motif":null,"min_aa":30}
          JSON
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' \
            --data-binary @"$RUNNER_TEMP/pairwise.json" http://127.0.0.1:3000/api/dev-science \
            -o "$RUNNER_TEMP/pairwise-result.json"
          python -c "import json,sys; x=json.load(open(sys.argv[1])); assert x['summary']['identity_percent']==87.5; assert x['summary']['mismatches']==1; assert x['result']['comparison']=='||||.|||'" "$RUNNER_TEMP/pairwise-result.json"
          cat > "$RUNNER_TEMP/matrix.json" <<'JSON'
          {"sequence":">alpha\nAAAA\n>beta\nAAAT\n>gamma\nAATT","sequence_type":"dna","operation":"comparison_matrix","motif":null,"min_aa":30}
          JSON
          curl -fsS --max-time 15 -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' \
            --data-binary @"$RUNNER_TEMP/matrix.json" http://127.0.0.1:3000/api/dev-science \
            -o "$RUNNER_TEMP/matrix-result.json"
          python -c "import json,sys; x=json.load(open(sys.argv[1])); assert x['summary']['comparisons']==3; assert x['result']['identity_matrix']==[[100,75,50],[75,100,75],[50,75,100]]" "$RUNNER_TEMP/matrix-result.json"
          rejected="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' \
            --data '{"sequence":">one\nATGC\n>one\nATGC","sequence_type":"dna","operation":"pairwise_global","motif":null,"min_aa":30}' \
            http://127.0.0.1:3000/api/dev-science)"
          test "$rejected" = "422"
          python - <<'PYTHON' > "$RUNNER_TEMP/msa.json"
          import json
          records=[("alpha","ACGT"*10),("beta","ACGT"*9+"TCGT"),
                   ("gamma","ACGT"*8+"ACGAACGT"),("delta","ACGT"*9+"ACGA")]
          print(json.dumps({"sequence":"\n".join(f">{name}\n{sequence}" for name,sequence in records),
                "sequence_type":"dna","operation":"msa_phylogeny","motif":None,"min_aa":30}))
          PYTHON
          curl -fsS --max-time 50 -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' \
            --data-binary @"$RUNNER_TEMP/msa.json" http://127.0.0.1:3000/api/dev-science \
            -o "$RUNNER_TEMP/msa-result.json"
          python -c "import json,sys; x=json.load(open(sys.argv[1])); assert x['summary']['sequence_count']==4; assert x['summary']['alignment_columns']>=40; assert x['result']['tree'] is not None; assert x['result']['newick'].endswith(';'); assert x['tool']['aligner']=='MAFFT'" "$RUNNER_TEMP/msa-result.json"
          status="$(curl -sS --max-time 12 -o /dev/null -w '%{http_code}' \
            -H 'Content-Type: application/json' -H 'Origin: http://127.0.0.1:3000' \
            --data '{"sequence":">a\nAT-G\n>b\nATGC\n>c\nATGC","sequence_type":"dna","operation":"msa_conservation","motif":null,"min_aa":30}' \
            http://127.0.0.1:3000/api/dev-science)"
          test "$status" = "422"
