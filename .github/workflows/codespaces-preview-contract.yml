name: Codespaces Preview Contract

on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - 'apps/web/app/preview/**'
      - 'apps/web/app/layout.tsx'
      - 'apps/web/app/page.tsx'
      - 'apps/web/proxy.ts'
      - 'scripts/codespaces-science-smoke.py'
      - 'scripts/test_codespaces_preview.py'
      - '.github/workflows/codespaces-preview-contract.yml'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'apps/web/app/preview/**'
      - 'apps/web/app/layout.tsx'
      - 'apps/web/app/page.tsx'
      - 'apps/web/proxy.ts'
      - 'scripts/codespaces-science-smoke.py'
      - 'scripts/test_codespaces_preview.py'
      - '.github/workflows/codespaces-preview-contract.yml'

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      GENITHM_CODESPACES_PREVIEW: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Run real scientific-worker methods offline
        run: python scripts/codespaces-science-smoke.py
      - name: Verify Codespaces security and auth boundaries
        run: python scripts/test_codespaces_preview.py
      - name: Install pinned frontend dependencies
        run: npm --prefix apps/web ci --no-fund
      - name: Check TypeScript
        working-directory: apps/web
        run: npm run typecheck
      - name: Verify public preview and protected workspace
        shell: bash
        run: |
          set -euo pipefail
          (
            cd apps/web
            nohup npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/preview.log" 2>&1 < /dev/null &
          )
          ready=0
          for attempt in $(seq 1 45); do
            if curl -fsS --max-time 10 http://127.0.0.1:3000/preview -o "$RUNNER_TEMP/preview.html"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            tail -n 100 "$RUNNER_TEMP/preview.log" || true
            exit 1
          fi
          grep -q "CODESPACES DEV PREVIEW" "$RUNNER_TEMP/preview.html"
          grep -q "FIXTURE: ATGAAATAA" "$RUNNER_TEMP/preview.html"
          grep -q "OFFLINE DEMO" "$RUNNER_TEMP/preview.html"
          curl -fsS --max-time 10 http://127.0.0.1:3000/ -o "$RUNNER_TEMP/home.html"
          grep -q "Open Development Preview" "$RUNNER_TEMP/home.html"
          status="$(curl -sS --max-time 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/dashboard/ai)"
          test "$status" = "307"
          curl -sSI --max-time 10 http://127.0.0.1:3000/dashboard/ai > "$RUNNER_TEMP/auth-redirect.txt"
          grep -q '/preview?setup=1' "$RUNNER_TEMP/auth-redirect.txt"
