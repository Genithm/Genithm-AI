name: One-time lock refresh for inherited dev advisories

on:
  push:
    branches: [fix/20261024-dev-dependency-advisories]
    paths:
      - 'apps/web/package.json'
      - '.github/workflows/one-time-npm-lock-refresh.yml'

permissions:
  contents: write

jobs:
  lock-refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Recalculate full lockfile with pinned transitive security overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
        working-directory: apps/web
      - name: Validate a clean npm ci and all-dependency audit
        run: |
          npm ci --ignore-scripts --no-fund
          npm audit --audit-level=moderate
        working-directory: apps/web
      - name: Commit exact npm-generated lockfile to this fix branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json
          if git diff --cached --quiet; then echo 'No lockfile changes'; exit 0; fi
          git commit -m 'Refresh lockfile for patched transitive dev dependencies'
          git push origin HEAD:fix/20261024-dev-dependency-advisories
