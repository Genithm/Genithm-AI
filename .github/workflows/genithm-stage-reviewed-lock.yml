# Temporary, owner-only staging. Removed before merge. Creates Git blobs only;
# it never changes a branch, merges a PR, deploys, or accesses production secrets.
name: Stage reviewed verification fixes
on:
  push:
    branches: [fix/v40-verification-hardening]
    paths: ['.github/workflows/genithm-stage-reviewed-lock.yml']
permissions:
  contents: read
jobs:
  stage:
    if: github.repository == 'Genithm/Genithm-AI' && github.actor == 'Genithm'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: 70b39f474ffba5a565a431de0d674dde9588f7bb
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Reproduce previously reviewed dependency proposal without scripts
        run: |
          cd apps/web
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact wrangler@4.151.1
          npm audit fix --package-lock-only --ignore-scripts
          npm audit
      - name: Apply exact fixes and stage content-addressed blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          root = pathlib.Path('.')
          output = root / 'artifacts/staged-fixes'
          output.mkdir(parents=True, exist_ok=True)
          def replace(path, old, new, count=1):
              p = root / path
              text = p.read_text()
              assert text.count(old) == count, (path, old, text.count(old))
              p.write_text(text.replace(old, new))
          lock = root / 'apps/web/package-lock.json'
          assert hashlib.sha256(lock.read_bytes()).hexdigest() == 'a8b003086abe2f058332f74c69225d3874d6f6da7b607faab3e0850f3beb00f0', 'Lockfile differs from reviewed proposal'
          frame = 'apps/web/components/genithm-workspace-frame.tsx'
          replace(frame, 'className="genithm-search-trigger" onClick', 'className="genithm-search-trigger" aria-label="Search pages and scientific tools" onClick')
          replace(frame, '<summary><span className="genithm-user-avatar"', '<summary aria-label={`Account menu for ${email}`}><span className="genithm-user-avatar"')
          css = 'apps/web/app/dashboard/workspace-chrome.css'
          replace(css, 'color:var(--g-muted);padding:9px 14px', 'color:var(--g-ink);padding:9px 14px')
          fastq = 'apps/web/app/dashboard/fastq-qc/fastq-qc-workbench.tsx'
          replace(fastq, 'import { useState } from "react";', 'import { useRef, useState } from "react";')
          replace(fastq, '  const router=useRouter();', '  const router=useRouter();\n  const r1Input=useRef<HTMLInputElement>(null);\n  const r2Input=useRef<HTMLInputElement>(null);')
          replace(fastq, '  function resetResults(){setSummary(null);setHashes([]);setError("");}', '  function resetResults(){setSummary(null);setHashes([]);setError("");}\n  function clearFiles(){\n    setR1(null);setR2(null);setTitle("");resetResults();\n    // Reset native controls too, so selecting the same file fires change again.\n    if(r1Input.current)r1Input.current.value="";\n    if(r2Input.current)r2Input.current.value="";\n  }')
          p = root / fastq
          text = p.read_text()
          needle = '<input type="file" accept=".fastq,.fq,.txt,text/plain"'
          assert text.count(needle) == 2
          text = text.replace(needle, '<input ref={r1Input} type="file" accept=".fastq,.fq,.txt,text/plain"', 1)
          text = text.replace(needle, '<input ref={r2Input} type="file" accept=".fastq,.fq,.txt,text/plain"', 1)
          p.write_text(text)
          replace(fastq, 'onClick={()=>{setR1(null);setR2(null);setSummary(null);setHashes([]);setError("");}}', 'onClick={clearFiles}')
          vcf = 'apps/web/app/dashboard/variant-qc/variant-qc-workbench.tsx'
          replace(vcf, 'setFile(null);setResult(null);setFingerprint("");setError("");', 'setFile(null);setResult(null);setFingerprint("");setTitle("");setError("");')
          test = 'scripts/test_genithm_product_browser.mjs'
          replace(test, "page.getByRole('alert').innerText()", "page.locator('main').getByRole('alert').innerText()", 2)
          paths = ['apps/web/package.json','apps/web/package-lock.json',frame,css,fastq,vcf,test]
          manifest = {}
          for path in paths:
              data = (root / path).read_bytes()
              expected = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              payload = json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              request = urllib.request.Request('https://api.github.com/repos/Genithm/Genithm-AI/git/blobs', data=payload, method='POST', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == expected
              manifest[path] = {'sha':expected,'sha256':hashlib.sha256(data).hexdigest()}
              destination = output / path
              destination.parent.mkdir(parents=True,exist_ok=True)
              destination.write_bytes(data)
          (output / 'manifest.json').write_text(json.dumps(manifest,indent=2))
          print(json.dumps(manifest,indent=2))
          PY
      - name: Upload staged fixes for independent comparison
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genithm-reviewed-fixes
          path: artifacts/staged-fixes/
          retention-days: 3
