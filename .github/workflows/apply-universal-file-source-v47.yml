name: Apply reviewed universal file source
on:
  push:
    branches: [feat/universal-file-intake-v47]
    paths: [.github/workflows/apply-universal-file-source-v47.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'Genithm/Genithm-AI' && github.ref == 'refs/heads/feat/universal-file-intake-v47'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify fixed patch and source tree; remove temporary staging
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip, hashlib, pathlib, subprocess
          expected = [
              '1e8b7f0c38556f0d423fcdec3ee2c4f31a07ad718eabe91d62435f050508c0f0',
              '52a4b0d0ff90ed756b0811429dbf7b296cdea51f11d9d630861dc714e6dcf600',
              'c155b12618cc03b3c44509de70783a56b21da37b6c51a5400b38247e8f0529d8',
              '071a81fffecf0956a1fd1f5207fc92e217e86c63c405eadb86eec25edb92372a',
          ]
          parts = []
          for index, digest in enumerate(expected):
              data = pathlib.Path(f'.github/v47-stage-{index}.txt').read_bytes()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(f'Staging segment {index} checksum mismatch')
              parts.append(data.strip())
          patch = gzip.decompress(base64.b64decode(b''.join(parts), validate=True))
          if hashlib.sha256(patch).hexdigest() != '1523e2abc84d3f0432aa57b2e3d20d13ea9d768e869b686b90b1b40aed39cc46':
              raise SystemExit('Patch checksum mismatch')
          pathlib.Path('/tmp/v47.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/v47.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/v47.patch'], check=True)
          for index in range(4):
              pathlib.Path(f'.github/v47-stage-{index}.txt').unlink()
          pathlib.Path('.github/workflows/prepare-universal-file-migration.yml').unlink()
          pathlib.Path('.github/workflows/apply-universal-file-source-v47.yml').unlink()
          PY
          git add -A
          test "$(git write-tree)" = c1937a26581cb1fb044e7a51f43ceb3f0227b196
          python scripts/security_policy.py
          git diff --cached --stat
          git config user.name 'Genithm Development'
          git config user.email 'development@genithm.invalid'
          git commit -m 'feat: universal bioinformatics file intake, batches and complete FASTA verification'
      - name: Publish verified source to this feature branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = c1937a26581cb1fb044e7a51f43ceb3f0227b196
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push origin HEAD:refs/heads/feat/universal-file-intake-v47
