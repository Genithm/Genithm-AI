name: Genithm V70 scientific Salmon quantification import

on:
  pull_request:
    paths:
      - 'apps/web/lib/salmon-quant-matrix.ts'
      - 'apps/web/app/dashboard/rnaseq/salmon-quant-workbench.tsx'
      - 'apps/web/app/dashboard/rnaseq/page.tsx'
      - 'apps/web/tests/salmon-quant-matrix-v70.test.mjs'
      - 'docs/salmon-quant-import-v70.md'
      - '.github/workflows/salmon-quant-import-v70.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/lib/salmon-quant-matrix.ts'
      - 'apps/web/app/dashboard/rnaseq/salmon-quant-workbench.tsx'
      - 'apps/web/app/dashboard/rnaseq/page.tsx'
      - 'apps/web/tests/salmon-quant-matrix-v70.test.mjs'
      - 'docs/salmon-quant-import-v70.md'
      - '.github/workflows/salmon-quant-import-v70.yml'
permissions:
  contents: read
jobs:
  verify-salmon-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate actual transcript quantification values and fail-closed format checks
        run: node --experimental-strip-types --test apps/web/tests/salmon-quant-matrix-v70.test.mjs
      - name: Preserve RNA-seq study design scientific intake and earlier expression tools
        run: node --experimental-strip-types --test apps/web/tests/rnaseq-study-preflight-v69.test.mjs apps/web/tests/expression-science-v56.test.mjs
