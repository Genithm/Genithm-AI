name: Worker deployment contract

on:
  pull_request:
    paths:
      - 'deploy/kubernetes/workers.yaml'
      - 'scripts/render_worker_deployment.py'
      - 'scripts/test_worker_deployment.py'
      - 'scripts/build_worker_release_manifest.py'
      - 'scripts/test_worker_release_manifest.py'
      - 'scripts/validate_worker_release.py'
      - 'scripts/test_validate_worker_release.py'
      - '.github/workflows/worker-deployment-contract.yml'
      - '.github/workflows/worker-release.yml'
      - '.github/workflows/worker-production-preflight.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/kubernetes/workers.yaml'
      - 'scripts/render_worker_deployment.py'
      - 'scripts/test_worker_deployment.py'
      - 'scripts/build_worker_release_manifest.py'
      - 'scripts/test_worker_release_manifest.py'
      - 'scripts/validate_worker_release.py'
      - 'scripts/test_validate_worker_release.py'
      - '.github/workflows/worker-deployment-contract.yml'
      - '.github/workflows/worker-release.yml'
      - '.github/workflows/worker-production-preflight.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Run deployment contract tests
        run: python scripts/test_worker_deployment.py
      - name: Run release manifest contract tests
        run: python scripts/test_worker_release_manifest.py
      - name: Run release deployment preflight tests
        run: python scripts/test_validate_worker_release.py
      - name: Render digest-pinned fixture
        run: |
          digest="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          python scripts/render_worker_deployment.py \
            --image "sequence=ghcr.io/genithm/sequence-worker@sha256:${digest}" \
            --image "source=ghcr.io/genithm/source-worker@sha256:${digest}" \
            --image "blast=ghcr.io/genithm/blast-worker@sha256:${digest}" \
            --image "scientific=ghcr.io/genithm/scientific-worker@sha256:${digest}" \
            --image "audit=ghcr.io/genithm/audit-worker@sha256:${digest}" \
            --image "ai=ghcr.io/genithm/ai-worker@sha256:${digest}" \
            --output /tmp/genithm-workers.yaml
          test "$(grep -c '@sha256:' /tmp/genithm-workers.yaml)" -eq 6
      - name: Build immutable release fixture
        run: |
          digest="aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          revision="bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
          python scripts/build_worker_release_manifest.py \
            --repository Genithm/Genithm-AI \
            --source-revision "$revision" \
            --deployment-manifest /tmp/genithm-workers.yaml \
            --image "sequence=ghcr.io/genithm/sequence-worker@sha256:${digest}" \
            --image "source=ghcr.io/genithm/source-worker@sha256:${digest}" \
            --image "blast=ghcr.io/genithm/blast-worker@sha256:${digest}" \
            --image "scientific=ghcr.io/genithm/scientific-worker@sha256:${digest}" \
            --image "audit=ghcr.io/genithm/audit-worker@sha256:${digest}" \
            --image "ai=ghcr.io/genithm/ai-worker@sha256:${digest}" \
            --output /tmp/worker-release.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/worker-release.json').read_text())
          assert payload['schema_version'] == 'genithm-worker-release/1'
          assert len(payload['workers']) == 6
          assert all('@sha256:' in item['image'] for item in payload['workers'])
          PY
          python scripts/validate_worker_release.py \
            --release-manifest /tmp/worker-release.json \
            --deployment-manifest /tmp/genithm-workers.yaml \
            --expected-revision "$revision"
