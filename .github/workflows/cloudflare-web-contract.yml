name: Cloudflare web contract

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/cloudflare-web-contract.yml'
  push:
    branches:
      - main
      - v1-cloudflare-workers-web
    paths:
      - 'apps/web/**'
      - '.github/workflows/cloudflare-web-contract.yml'

permissions:
  contents: write

jobs:
  cloudflare-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Generate candidate dependency lockfile
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit generated lockfile to migration branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/v1-cloudflare-workers-web'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/web/package-lock.json; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package-lock.json
          git commit -m 'Lock Cloudflare Workers web dependencies'
          git push origin HEAD:v1-cloudflare-workers-web
      - name: Install locked web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck
      - name: Build Next.js for Cloudflare Workers
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_contract_test
          GENITHM_APP_URL: https://example.com
        run: npm run cf:build
      - name: Verify OpenNext deployment output
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          test -f .open-next/worker.js
          test -d .open-next/assets
          test -f middleware.ts
          test ! -e proxy.ts
          grep -q '"main": ".open-next/worker.js"' wrangler.jsonc
          grep -q '"nodejs_compat"' wrangler.jsonc
