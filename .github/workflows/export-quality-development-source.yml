name: Export quality development source
on:
  push:
    branches: [feat/read-quality-profiles-v46]
    paths: [.github/workflows/export-quality-development-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          ref: d2326316993f146031f2e7ff7efc7fb238b40f23
      - name: Archive tracked baseline only
        run: |
          mkdir /tmp/genithm-source
          git archive --format=zip HEAD > /tmp/genithm-source/source.zip
          git rev-parse HEAD > /tmp/genithm-source/revision.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genithm-v46-source-baseline
          path: /tmp/genithm-source
          retention-days: 2
