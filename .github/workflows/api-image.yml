name: API image

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-image.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-image.yml'

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Build AMD64 API image
        run: docker build --pull --platform linux/amd64 -t genithm-api:amd64-ci apps/api
      - name: Create Buildx builder
        run: docker buildx create --use --name genithm-api-ci
      - name: Build ARM64 API image
        run: docker buildx build --pull --platform linux/arm64 --load -t genithm-api:arm64-ci apps/api
      - name: Verify non-root image users
        shell: bash
        run: |
          set -euo pipefail
          for tag in amd64-ci arm64-ci; do
            user="$(docker image inspect --format '{{.Config.User}}' "genithm-api:${tag}")"
            test "$user" != ""
            test "$user" != "root"
            test "$user" != "0"
          done
      - name: Verify hardened AMD64 runtime contract
        run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=1 --network=none --tmpfs /tmp:rw,noexec,nosuid,size=16m genithm-api:amd64-ci --help
      - name: Verify hardened ARM64 runtime contract
        run: docker run --rm --read-only --cap-drop=ALL --security-opt=no-new-privileges --pids-limit=64 --memory=256m --cpus=1 --network=none --tmpfs /tmp:rw,noexec,nosuid,size=16m genithm-api:arm64-ci --help
      - name: Block fixable HIGH or CRITICAL AMD64 vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: genithm-api:amd64-ci
          format: table
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln
      - name: Block fixable HIGH or CRITICAL ARM64 vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: genithm-api:arm64-ci
          format: table
          exit-code: '1'
          ignore-unfixed: 'true'
          severity: HIGH,CRITICAL
          vuln-type: os,library
          scanners: vuln
      - name: Generate API SBOMs
        shell: bash
        run: |
          trivy image --format cyclonedx --output api.amd64.sbom.cdx.json genithm-api:amd64-ci
          trivy image --format cyclonedx --output api.arm64.sbom.cdx.json genithm-api:arm64-ci
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-sbom-${{ github.sha }}
          path: |
            api.amd64.sbom.cdx.json
            api.arm64.sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
