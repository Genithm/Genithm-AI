name: Oracle Terraform

on:
  pull_request:
    paths:
      - 'deploy/oracle/terraform/**'
      - '.github/workflows/oracle-terraform.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/oracle/terraform/**'
      - '.github/workflows/oracle-terraform.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: '1.16.2'
          terraform_wrapper: false
      - name: Check Terraform formatting
        working-directory: deploy/oracle/terraform
        run: terraform fmt -check -recursive
      - name: Initialize providers without backend
        working-directory: deploy/oracle/terraform
        run: terraform init -backend=false -input=false
      - name: Validate Oracle infrastructure configuration
        working-directory: deploy/oracle/terraform
        run: terraform validate -no-color
