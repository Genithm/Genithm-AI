name: Oracle deploy contract

on:
  pull_request:
    paths:
      - 'deploy/oracle/**'
      - 'scripts/oracle_deploy_preflight.py'
      - 'scripts/test_oracle_deploy_preflight.py'
      - '.github/workflows/oracle-deploy-contract.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/oracle/**'
      - 'scripts/oracle_deploy_preflight.py'
      - 'scripts/test_oracle_deploy_preflight.py'
      - '.github/workflows/oracle-deploy-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned test runner
        run: python -m pip install pytest==9.1.1
      - name: Test Oracle deployment preflight
        run: python -m pytest -q scripts/test_oracle_deploy_preflight.py
