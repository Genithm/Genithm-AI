name: Oracle deploy contract

on:
  pull_request:
    paths:
      - 'deploy/oracle/**'
      - 'scripts/oracle_deploy_preflight.py'
      - 'scripts/test_oracle_deploy_preflight.py'
      - '.github/workflows/oracle-deploy-contract.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/oracle/**'
      - 'scripts/oracle_deploy_preflight.py'
      - 'scripts/test_oracle_deploy_preflight.py'
      - '.github/workflows/oracle-deploy-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install pinned test runner
        run: python -m pip install pytest==9.1.1
      - name: Test Oracle deployment preflight
        run: python -m pytest -q scripts/test_oracle_deploy_preflight.py
