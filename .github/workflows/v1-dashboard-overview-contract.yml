name: V1 dashboard overview contract

on:
  pull_request:
    paths:
      - 'apps/web/app/dashboard/layout.tsx'
      - 'apps/web/components/dashboard-home-overview.tsx'
      - 'apps/web/components/dashboard-home-overview.module.css'
      - 'apps/web/components/dashboard-section-navigator.tsx'
      - 'scripts/test_v1_dashboard_overview_contract.py'
      - '.github/workflows/v1-dashboard-overview-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/app/dashboard/layout.tsx'
      - 'apps/web/components/dashboard-home-overview.tsx'
      - 'apps/web/components/dashboard-home-overview.module.css'
      - 'apps/web/components/dashboard-section-navigator.tsx'
      - 'scripts/test_v1_dashboard_overview_contract.py'
      - '.github/workflows/v1-dashboard-overview-contract.yml'

permissions:
  contents: read

jobs:
  dashboard-overview-contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test V1 dashboard overview contract
        working-directory: .
        run: python scripts/test_v1_dashboard_overview_contract.py
      - name: Install web dependencies
        run: npm ci
      - name: Typecheck web
        run: npm run typecheck
