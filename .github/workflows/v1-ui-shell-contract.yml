name: V1 UI shell contract

on:
  pull_request:
    paths:
      - 'apps/web/app/dashboard/layout.tsx'
      - 'apps/web/app/dashboard/dashboard-section-nav.css'
      - 'apps/web/components/dashboard-primary-nav.tsx'
      - 'apps/web/components/dashboard-section-navigator.tsx'
      - 'scripts/test_v1_ui_shell_contract.py'
      - '.github/workflows/v1-ui-shell-contract.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/app/dashboard/layout.tsx'
      - 'apps/web/app/dashboard/dashboard-section-nav.css'
      - 'apps/web/components/dashboard-primary-nav.tsx'
      - 'apps/web/components/dashboard-section-navigator.tsx'
      - 'scripts/test_v1_ui_shell_contract.py'
      - '.github/workflows/v1-ui-shell-contract.yml'

permissions:
  contents: read

jobs:
  ui-shell-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test dashboard UI shell contract
        run: python scripts/test_v1_ui_shell_contract.py
      - name: Typecheck web
        working-directory: apps/web
        run: npm ci && npm run typecheck
