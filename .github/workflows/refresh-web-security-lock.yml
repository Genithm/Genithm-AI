name: Refresh pinned web security dependencies

on:
  push:
    branches:
      - feature/scientific-capability-registry
    paths:
      - .github/workflows/refresh-web-security-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    if: github.repository == 'Genithm/Genithm-AI' && github.ref == 'refs/heads/feature/scientific-capability-registry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Pin patched dependencies and regenerate lockfile
        working-directory: apps/web
        run: |
          npm pkg set 'overrides.sharp=0.35.5' 'overrides.source-map-js=1.2.2'
          npm install next@16.4.0 --save-exact --package-lock-only --ignore-scripts --no-audit
          npm audit --omit=dev --audit-level=high
      - name: Validate pinned clean install and typecheck
        working-directory: apps/web
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Commit vetted pinned manifests
        env:
          GH_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name 'genithm-ci[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/package.json apps/web/package-lock.json
          git diff --cached --exit-code && exit 0 || true
          git commit -m 'Security: pin patched Next.js and transitive dependencies'
          git push origin "HEAD:refs/heads/$GH_BRANCH"
