name: Science staging readiness (manual)

# READ-ONLY validation; no migrations, deployment, science approval or NCBI calls.
on:
  workflow_dispatch:
    inputs:
      staging_project_ref:
        description: Exact isolated Supabase staging project ref
        required: true
        type: string
      approved_message_id:
        description: Optional staging user message UUID
        required: false
        type: string
      approved_run_id:
        description: Matching staging science run UUID, required with message ID
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: science-staging-readiness
  cancel-in-progress: false

jobs:
  read-only-staging-check:
    runs-on: ubuntu-latest
    environment: science-staging
    timeout-minutes: 10
    env:
      STAGING_REF: ${{ inputs.staging_project_ref }}
      PRODUCTION_REF: ${{ vars.GENITHM_PRODUCTION_SUPABASE_REF }}
      STAGING_DATABASE_URL: ${{ secrets.GENITHM_SCIENCE_STAGING_DATABASE_URL }}
      TEST_MESSAGE_ID: ${{ inputs.approved_message_id }}
      TEST_RUN_ID: ${{ inputs.approved_run_id }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false

      - name: Reject production URL, missing safeguards and malformed identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from urllib.parse import urlsplit

          def fail(reason):
              raise SystemExit("Stage check refused: " + reason)

          if os.getenv("GITHUB_REF") != "refs/heads/main":
              fail("only the main-branch workflow can run")
          staging = os.getenv("STAGING_REF", "")
          production = os.getenv("PRODUCTION_REF", "")
          if not re.fullmatch(r"[a-z0-9]{20}", staging):
              fail("invalid staging project reference")
          if not re.fullmatch(r"[a-z0-9]{20}", production):
              fail("production reference protection must be configured")
          if staging == production:
              fail("the staging project must not be production")
          url_text = os.getenv("STAGING_DATABASE_URL", "")
          if not url_text:
              fail("the protected staging database URL is missing")
          url = urlsplit(url_text)
          if url.scheme not in ("postgresql", "postgres") or url.hostname != f"db.{staging}.supabase.co":
              fail("staging URL must use the exact direct Supabase Postgres hostname")
          if url.port not in (5432, None) or not url.username or not url.password:
              fail("staging URL lacks required direct-connection details")
          msg = os.getenv("TEST_MESSAGE_ID", "")
          run = os.getenv("TEST_RUN_ID", "")
          if bool(msg) != bool(run):
              fail("message and run IDs must be supplied together")
          uuid = re.compile(r"^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$", re.I)
          if msg and (not uuid.fullmatch(msg) or not uuid.fullmatch(run)):
              fail("staging test IDs must be valid UUIDs")
          print("Verified isolated staging target and read-only parameters.")
          PY

      - name: Verify science columns, grants and forced RLS (read-only)
        shell: bash
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=10
          result=$(psql "$STAGING_DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -f supabase/tests/v26_science_release_readiness.sql)
          if ! grep -q '^SCIENCE_V26_READY|' <<< "$result"; then
            echo "SCIENCE_V26_BLOCKED: schema/RLS/RPC readiness failed" >&2
            exit 1
          fi
          echo "SCIENCE_V26_READY: staging schema and grants verified."

      - name: Audit completed staging science run (optional and read-only)
        if: inputs.approved_message_id != ''
        shell: bash
        run: |
          set -euo pipefail
          export PGCONNECT_TIMEOUT=10
          result=$(psql "$STAGING_DATABASE_URL" -X -qAt -v ON_ERROR_STOP=1 \
            -v message_id="$TEST_MESSAGE_ID" -v run_id="$TEST_RUN_ID" \
            -f supabase/tests/v25_staging_evidence_readonly.sql)
          if ! grep -q 'PASS: recorded lineage consistent' <<< "$result"; then
            echo "Staging scientific record is absent or evidence-incomplete" >&2
            exit 1
          fi
          echo "Recorded staging lineage consistent. Verify artifact bytes with authenticated download separately."
