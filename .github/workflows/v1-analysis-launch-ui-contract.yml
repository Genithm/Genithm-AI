name: V1 analysis launch UI contract

on:
  pull_request:
    paths:
      - "apps/web/components/analysis-launch-guard.tsx"
      - "apps/web/app/dashboard/layout.tsx"
      - "scripts/test_v1_analysis_launch_ui_contract.py"
      - ".github/workflows/v1-analysis-launch-ui-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Check analysis launch UI contract
        run: python scripts/test_v1_analysis_launch_ui_contract.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck
