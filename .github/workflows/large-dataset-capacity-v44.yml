name: Large dataset transport capacity
on:
  pull_request:
    paths:
      - 'apps/api/app/bulk_*.py'
      - 'apps/api/tests/test_bulk_*.py'
      - 'apps/api/tests/benchmark_bulk_transfer.py'
      - '.github/workflows/large-dataset-capacity-v44.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multipart-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install existing pinned API test dependencies
        run: python -m pip install -e 'apps/api[dev]'
      - name: Test transfer integrity, interruption, recovery and storage binding
        run: |
          set -euo pipefail
          mkdir -p artifacts/bulk-transfer
          pytest -q apps/api/tests/test_bulk_transfer.py apps/api/tests/test_bulk_s3.py | tee artifacts/bulk-transfer/tests.txt
      - name: Transfer and resume an actual 2 GiB object over loopback S3
        shell: bash
        run: |
          set -euo pipefail
          image='docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46'
          trap 'docker rm -fv genithm-bulk-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name genithm-bulk-ci --memory=2g --cpus=2 \
            -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=test-genithm \
            -e MINIO_ROOT_PASSWORD=temporary-ci-only-password-0123456789 \
            "$image" server /data --console-address :9001
          healthy=false
          for attempt in $(seq 1 60); do
            if docker exec genithm-bulk-ci silo healthcheck ready; then
              healthy=true
              break
            fi
            sleep 2
          done
          test "$healthy" = true
          python apps/api/tests/benchmark_bulk_transfer.py --gib 2 --s3-loopback \
            > artifacts/bulk-transfer/s3-2gib.json
          cat artifacts/bulk-transfer/s3-2gib.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: genithm-large-dataset-capacity
          path: artifacts/bulk-transfer
          retention-days: 14
