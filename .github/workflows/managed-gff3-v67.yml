name: Genithm V67 real streaming GFF3 feature QC
on:
  pull_request:
    paths:
      - 'apps/api/app/large_data/gff3_scanner.py'
      - 'apps/api/app/large_data/file_registry.py'
      - 'apps/api/app/large_data/file_intake.py'
      - 'apps/api/app/large_data/verify.py'
      - 'apps/api/app/large_data/quality_report.py'
      - 'apps/api/tests/test_gff3_large_data_v67.py'
      - 'apps/web/lib/verified-research-files.ts'
      - 'apps/web/tests/verified-gff3-chat-v67.test.mjs'
      - '.github/workflows/managed-gff3-v67.yml'
  push:
    branches: [main]
    paths:
      - 'apps/api/app/large_data/**'
      - 'apps/api/tests/test_gff3_large_data_v67.py'
      - 'apps/web/lib/verified-research-files.ts'
      - 'apps/web/tests/verified-gff3-chat-v67.test.mjs'
      - '.github/workflows/managed-gff3-v67.yml'
permissions:
  contents: read
jobs:
  full-stream-gff3-science:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install application validation and isolated integration test dependencies
        run: python -m pip install -e 'apps/api[dev]'
      - name: Verify real GFF3 structural QC, privacy, historical report compatibility
        run: pytest -q apps/api/tests/test_gff3_large_data_v67.py apps/api/tests/test_vcf_large_data_v64.py apps/api/tests/test_file_intake_v47.py
      - name: Verify private V67 GFF3 and V65 VCF DB-snapshot-bound AI evidence
        run: |
          node --experimental-strip-types --test apps/web/tests/verified-gff3-chat-v67.test.mjs
          node --experimental-strip-types --test apps/web/tests/test-verified-vcf-chat-v65.mjs
          node --experimental-strip-types --test apps/web/tests/test-verified-research-files-v48.mjs
