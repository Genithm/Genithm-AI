name: Sequence ingestion capacity
on:
  pull_request:
    paths:
      - 'apps/sequence-worker/**'
      - '.github/workflows/sequence-ingest-capacity-v42.yml'
  push:
    branches: [main]
    paths:
      - 'apps/sequence-worker/**'
      - '.github/workflows/sequence-ingest-capacity-v42.yml'
permissions:
  contents: read
concurrency:
  group: ingest-capacity-${{ github.ref }}
  cancel-in-progress: true
jobs:
  streaming-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install pinned sequence-worker test dependencies
        run: python -m pip install -e 'apps/sequence-worker[dev]'
      - name: Test parity, transfer limits, closure and actual HTTP integration
        run: pytest -q apps/sequence-worker/tests
      - name: Measure actual ingestion throughput in fresh processes
        run: |
          mkdir -p artifacts/ingest-capacity
          python apps/sequence-worker/tests/benchmark_ingest.py --mib 16 > artifacts/ingest-capacity/wrapped.json
          python apps/sequence-worker/tests/benchmark_ingest.py --mib 8 --unwrapped > artifacts/ingest-capacity/unwrapped.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genithm-ingestion-capacity
          path: artifacts/ingest-capacity
          retention-days: 14
