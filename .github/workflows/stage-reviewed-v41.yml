name: Stage reviewed V41 changes
on:
  push:
    branches: [feat/desktop-scientific-execution-v41]
    paths: ['.github/workflows/stage-reviewed-v41.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify reviewed patch and stage unattached content blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          root=pathlib.Path('.')
          parts=[f'.github/v41-review/{i}.b64' for i in range(10)]
          encoded=''.join((root/p).read_text().strip() for p in parts)
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='4119fb5f3cfa6fd75f373e0756bb0929ca22d6ff0e9edb63051de716a706ed5e'
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'.github/workflows/scientific-capacity-v41.yml','apps/scientific-worker/genithm_scientific_worker/consumer_pool.py','apps/scientific-worker/genithm_scientific_worker/entrypoint.py','apps/scientific-worker/genithm_scientific_worker/pairwise.py','apps/scientific-worker/genithm_scientific_worker/runtime_v4.py','apps/scientific-worker/pyproject.toml','apps/scientific-worker/tests/benchmark_pairwise.py','apps/scientific-worker/tests/pairwise_reference.py','apps/scientific-worker/tests/test_consumer_pool.py','apps/scientific-worker/tests/test_pairwise_capacity.py','apps/web/app/desktop-required/page.tsx','apps/web/lib/desktop-workspace-policy.ts','apps/web/proxy.ts','apps/web/tests/desktop-workspace-v41.test.mjs','deploy/codespaces/docker-compose.preview.yml','deploy/kubernetes/workers.yaml','docs/desktop-scientific-execution-v41.md','release/v1/candidate.json','scripts/build_v1_release_bundle.py','scripts/codespaces_preview.sh','scripts/test_genithm_product_browser.mjs'}
          assert set(changed)==allowed,(set(changed)^allowed)
          repo=os.environ['GITHUB_REPOSITORY'];head=os.environ['GITHUB_SHA']
          assert repo=='Genithm/Genithm-AI'
          entries=[]
          for name in changed:
            data=(root/name).read_bytes()
            expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            request=urllib.request.Request('https://api.github.com/repos/'+repo+'/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(data).decode()}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
            with urllib.request.urlopen(request,timeout=45) as response: blob=json.load(response)
            assert blob['sha']==expected
            mode=subprocess.check_output(['git','ls-files','--stage','--',name],text=True).split()[0]
            entries.append({'path':name,'mode':mode,'type':'blob','sha':expected})
          pathlib.Path('artifacts/review').mkdir(parents=True)
          pathlib.Path('artifacts/review/staged-blobs.json').write_text(json.dumps({'parent':head,'reviewed_patch_sha256':hashlib.sha256(patch).hexdigest(),'entries':entries},indent=2))
          print('Reviewed blobs staged. No tree, commit, workflow or branch was updated.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genithm-v41-reviewed-blobs
          path: artifacts/review/
          retention-days: 3
