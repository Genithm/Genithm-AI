name: Production smoke contract

on:
  pull_request:
    paths:
      - 'scripts/production_smoke.py'
      - 'scripts/test_production_smoke.py'
      - 'apps/web/app/api/health/route.ts'
      - '.github/workflows/production-smoke.yml'
      - '.github/workflows/production-smoke-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/production_smoke.py'
      - 'scripts/test_production_smoke.py'
      - 'apps/web/app/api/health/route.ts'
      - '.github/workflows/production-smoke.yml'
      - '.github/workflows/production-smoke-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Validate production smoke release contract
        working-directory: scripts
        run: python -m unittest -v test_production_smoke.py
