name: Production smoke contract

on:
  pull_request:
    paths:
      - 'scripts/production_smoke.py'
      - 'scripts/test_production_smoke.py'
      - 'apps/web/app/api/health/route.ts'
      - '.github/workflows/production-smoke.yml'
      - '.github/workflows/production-smoke-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/production_smoke.py'
      - 'scripts/test_production_smoke.py'
      - 'apps/web/app/api/health/route.ts'
      - '.github/workflows/production-smoke.yml'
      - '.github/workflows/production-smoke-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Validate production smoke release contract
        working-directory: scripts
        run: python -m unittest -v test_production_smoke.py
