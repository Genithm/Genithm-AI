name: Export managed data review
on:
  push:
    branches: ['review/managed-data-final-audit']
    paths: ['.github/workflows/export-managed-data-review.yml']
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
          ref: ecb1a5d01083ff93297ea27cee063cbbca81e869
      - name: Export tracked public source only
        run: |
          mkdir -p review
          git rev-parse HEAD > review/revision.txt
          git archive --format=zip --output=review/source.zip HEAD
          sha256sum review/source.zip > review/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genithm-v44-source-review
          path: review
          retention-days: 3
          if-no-files-found: error
