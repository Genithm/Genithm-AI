name: Stage reviewed streaming ingestion
on:
  push:
    branches: [feat/streaming-sequence-ingest-v42]
    paths: [.github/workflows/stage-reviewed-ingest-v42.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Verify reviewed patch and stage blobs without changing branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,pathlib,subprocess,urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; head=os.environ['GITHUB_SHA']
          assert repo=='Genithm/Genithm-AI'
          def api(path,data=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=None if data is None else json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if data is None else 'POST')
              with urllib.request.urlopen(req,timeout=45) as r:return json.load(r)
          parts=['a627975a531f17bb4df5715d4b339c6d65e77102','4f1eb62cc0084a32ff39a4b4f5ff6f907d6d4eda']
          compressed=b''.join(base64.b64decode(api('/git/blobs/'+sha)['content']) for sha in parts)
          assert len(compressed)==14883
          patch=gzip.decompress(compressed)
          digest=hashlib.sha256(patch).hexdigest()
          assert digest=='976e3826e834b14eab46b612975ae42f22c55b8e13e58bce634af81f2e962343'
          assert len(patch)==48049
          subprocess.run(['git','apply','--check','--index','-'],input=patch,check=True)
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          changed=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          allowed={'.github/workflows/sequence-ingest-capacity-v42.yml','apps/sequence-worker/genithm_sequence_worker/entrypoint.py','apps/sequence-worker/genithm_sequence_worker/runtime.py','apps/sequence-worker/genithm_sequence_worker/streaming.py','apps/sequence-worker/pyproject.toml','apps/sequence-worker/tests/benchmark_ingest.py','apps/sequence-worker/tests/test_streaming.py','apps/sequence-worker/tests/test_streaming_runtime.py','docs/bioinformatics-capability-roadmap.md','docs/streaming-sequence-ingest-v42.md','release/v1/candidate.json'}
          assert set(changed)==allowed,(set(changed)^allowed)
          entries=[]
          for path in changed:
              mode,expected,*_=subprocess.check_output(['git','ls-files','--stage','--',path],text=True).split()
              actual=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(pathlib.Path(path).read_bytes()).decode()})['sha']
              assert actual==expected,(path,expected,actual)
              entries.append({'path':path,'mode':mode,'type':'blob','sha':actual})
          result={'parent':head,'base_tree':api('/git/commits/'+head)['tree']['sha'],'reviewed_patch_sha256':digest,'entries':entries}
          out=pathlib.Path('artifacts/review');out.mkdir(parents=True)
          (out/'staged-blobs.json').write_text(json.dumps(result,indent=2))
          print('Reviewed scientific source blobs staged; no branches, workflows or deployment references changed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: genithm-v42-reviewed-blobs
          path: artifacts/review/
          retention-days: 3
