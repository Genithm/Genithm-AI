name: V1 auth entry UI contract

on:
  pull_request:
    paths:
      - "apps/web/app/login/**"
      - "apps/web/app/signup/**"
      - "apps/web/next.config.ts"
      - "scripts/codespaces_preview.sh"
      - "scripts/test_v1_auth_entry_ui_contract.py"
      - ".github/workflows/v1-auth-entry-ui-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
      - name: Check Codespaces launcher syntax
        run: bash -n scripts/codespaces_preview.sh
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Check auth entry UI contract
        run: python scripts/test_v1_auth_entry_ui_contract.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci
      - name: Typecheck web
        working-directory: apps/web
        run: npm run typecheck
