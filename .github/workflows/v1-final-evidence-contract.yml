name: V1 final evidence contract

on:
  pull_request:
    paths:
      - 'scripts/validate_v1_final_evidence.py'
      - 'scripts/test_v1_final_evidence_contract.py'
      - 'release/v1/final-evidence.example.json'
      - 'docs/deployment/PRODUCTION_LAUNCH_V1.md'
      - '.github/workflows/v1-final-evidence-contract.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/validate_v1_final_evidence.py'
      - 'scripts/test_v1_final_evidence_contract.py'
      - 'release/v1/final-evidence.example.json'
      - 'docs/deployment/PRODUCTION_LAUNCH_V1.md'
      - '.github/workflows/v1-final-evidence-contract.yml'

permissions:
  contents: read

jobs:
  final-evidence-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test V1 final release evidence contract
        run: python scripts/test_v1_final_evidence_contract.py
      - name: Compile validator
        run: python -m py_compile scripts/validate_v1_final_evidence.py
