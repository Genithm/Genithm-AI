name: Production E2E contract

on:
  pull_request:
    paths:
      - 'scripts/production_e2e.py'
      - 'scripts/test_production_e2e.py'
      - '.github/workflows/production-e2e-contract.yml'
      - 'docs/deployment/PRODUCTION_E2E.md'
  push:
    branches: [main]
    paths:
      - 'scripts/production_e2e.py'
      - 'scripts/test_production_e2e.py'
      - '.github/workflows/production-e2e-contract.yml'
      - 'docs/deployment/PRODUCTION_E2E.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
      - name: Install pinned test runner
        run: python -m pip install pytest==9.1.1
      - name: Validate production E2E harness
        run: python -m pytest -q scripts/test_production_e2e.py
