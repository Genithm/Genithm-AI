name: V51 source review
on:
  push:
    branches: [fix/v51-runtime-startup]
    paths: [.github/workflows/v51-source-review.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD > /tmp/genithm-v51-source.tar
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: genithm-v51-source
          path: /tmp/genithm-v51-source.tar
          retention-days: 1
